name: PRDay
options:
  bundleIdPrefix: com.zzoutuo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JP4TN5PTS3
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  PRDay:
    type: application
    platform: iOS
    sources:
      - path: PRDay
    info:
      path: PRDay/Info.plist
      properties:
        CFBundleDisplayName: PRDay
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
        NSCameraUsageDescription: "PRDay records short running-form videos for AI analysis. Frames are processed on-device and deleted immediately."
        NSLocationWhenInUseUsageDescription: "PRDay checks local heat conditions so your training adapts to the weather."
        NSHealthShareUsageDescription: "PRDay can optionally read resting heart rate and sleep to add context to your training. Read-only."
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.PRDay
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PRDay/PRDay.entitlements
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: GLMProxySecret.txt
  PRDayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PRDayTests
    dependencies:
      - target: PRDay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PRDay:
    build:
      targets:
        PRDay: all
    test:
      targets:
        - PRDayTests
